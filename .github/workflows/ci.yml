---
name: CI
on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"

concurrency:
  # On the main branch we want all builds to complete, even if new commits are merged.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    permissions:
      contents: read
      id-token: write # Authenticate to Depot with OIDC.
    # identity and katapult call krystal/workflows' container-image-build.yml
    # here. This repository is public, so it can't; the local copy takes the
    # same inputs and pushes the same tags. See that file for details.
    uses: ./.github/workflows/container-image-build.yml
    with:
      # Images go to Depot Registry, which Harbor pull-replicates into
      # registry.k.io/postal/postal for deployment.
      image_name: postal/postal
      build_target: full
      build_args: |
        BRANCH=${{ github.ref_name }}
    secrets:
      DEPOT_REGISTRY_TOKEN: ${{ secrets.DEPOT_REGISTRY_TOKEN }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    env:
      POSTAL_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DEPOT_REGISTRY_HOST }}
          username: x-token
          password: ${{ secrets.DEPOT_REGISTRY_TOKEN }}
      - run: docker pull "$POSTAL_IMAGE"
      - run: docker compose run --rm postal sh -c 'bundle exec rspec'
