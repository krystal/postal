---
name: CI
on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Images go to Depot Registry, which Harbor pull-replicates into
  # registry.k.io/postal/postal for deployment.
  IMAGE_REPOSITORY: postal/postal

jobs:
  # This job does what krystal/workflows' container-image-build.yml does for
  # comms: build with Depot, push to Depot Registry, and use the same tags.
  # Postal can't call that workflow because this repository is a public fork,
  # and GitHub only lets private repositories use reusable workflows stored in
  # a private repository. If this repository becomes private, replace this job
  # with a call to that workflow, as comms does.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate to Depot with OIDC.
    outputs:
      image: ${{ steps.info.outputs.image }}
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
      DEPOT_REGISTRY_HOST: ${{ vars.DEPOT_REGISTRY_HOST }}
      DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags for the version.
          persist-credentials: false
      - name: Work out version and image tags
        id: info
        run: |
          if [[ -z "${DEPOT_PROJECT_ID}" || -z "${DEPOT_REGISTRY_HOST}" ]]; then
            echo "The DEPOT_PROJECT_ID and DEPOT_REGISTRY_HOST variables must be" \
              "available to this repository" >&2
            exit 1
          fi

          image="${DEPOT_REGISTRY_HOST}/${IMAGE_REPOSITORY}"

          # Docker tags allow [A-Za-z0-9_.-] up to 128 characters. Leave room
          # for the branch- prefix.
          ref_name="$(printf '%s' "${GITHUB_REF_NAME}" | LC_ALL=C sed -E \
            's/[^A-Za-z0-9_]+/-/g; s/^-+//; s/-+$//')"
          ref_name="${ref_name:0:121}"
          ref_name="${ref_name%-}"
          ref_name="${ref_name:-ref}"

          version="$(git describe --tags --always)"
          version="${version#v}"

          {
            echo "image=${image}:commit-${GITHUB_SHA}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:commit-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:latest"
              echo "${image}:main-${GITHUB_SHA}"
            else
              echo "${image}:branch-${ref_name}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.DOCKER_HUB_LOGIN == 'true' }}
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DEPOT_REGISTRY_HOST }}
          # Depot Registry always uses x-token as the username.
          username: x-token
          password: ${{ secrets.DEPOT_REGISTRY_TOKEN }}
      - uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.info.outputs.tags }}
          build-args: |
            VERSION=${{ steps.info.outputs.version }}
            BRANCH=${{ github.ref_name }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    env:
      POSTAL_IMAGE: ${{ needs.build.outputs.image }}
      DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.DOCKER_HUB_LOGIN == 'true' }}
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.DEPOT_REGISTRY_HOST }}
          username: x-token
          password: ${{ secrets.DEPOT_REGISTRY_TOKEN }}
      - run: docker compose pull
      - run: docker compose run --rm postal sh -c 'bundle exec rspec'
